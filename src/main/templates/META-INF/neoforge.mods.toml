modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
logoBlur = false
authors = "Misanthropy, bigenergy, txni, Mephodio"
credits = "NeoForge 1.21.1 port by avectus1. Original mod by Misanthropy, bigenergy, txni and Mephodio."
description = '''
Fastvancements is a zero-dependency performance mod that aggressively rewrites Minecraft's advancement engine.

Features:
- O(1) Reverse Indexing: Eliminates brute-force inventory scanning.
- Efficient Tick Skipping: Throttles position and environment checking per player.
- Zero Library Bloat: Pure, native performance without heavy framework wrappers.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
